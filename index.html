
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Introduction to Integration | Edwin Garcia Cuevas</title>
  <meta
    name="description"
    content="An introduction to integration and Riemann sums, with supplementary practice problems and worked solutions."
  >

  <style>
    :root {
      color-scheme: dark;

      --background: #25292e;
      --surface: #2c3036;
      --surface-raised: #343940;
      --border: #454b53;
      --text: #e7e8eb;
      --muted: #aeb5bd;

      --gold: #f0d98a;
      --teal: #65d6c2;
      --lavender: #d9a5e8;

      --radius: 10px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: var(--background);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    button {
      font: inherit;
    }

    /* --------------------------------
       Site header
    -------------------------------- */

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      padding: 23px clamp(20px, 5vw, 72px);
      border-bottom: 1px solid var(--border);
    }

    .site-title {
      margin: 0;
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      font-weight: 500;
      letter-spacing: 0.015em;
    }

    .site-subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(0.85rem, 1.4vw, 1rem);
      line-height: 1.5;
    }

    .author-label {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.13em;
      text-align: right;
      text-transform: uppercase;
    }

    /* --------------------------------
       Main workspace
    -------------------------------- */

    .workspace {
      width: 100%;
      max-width: 1450px;
      margin: 0 auto;
      padding: 25px clamp(14px, 4vw, 52px) 36px;
      flex: 1;
    }

    /* --------------------------------
       Navigation tabs
    -------------------------------- */

    .resource-navigation {
      display: flex;
      align-items: stretch;
      gap: 8px;

      width: 100%;
      margin-bottom: 0;
      padding: 0 0 0 4px;

      border-bottom: 1px solid var(--border);
    }

    .tab-button {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      min-height: 54px;
      padding: 0 23px;

      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 9px 9px 0 0;

      color: var(--muted);
      background: transparent;

      font-size: 0.91rem;
      cursor: pointer;

      transition:
        color 160ms ease,
        background 160ms ease,
        border-color 160ms ease;
    }

    .tab-button:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.035);
    }

    .tab-button:focus-visible {
      z-index: 2;
      outline: 2px solid var(--gold);
      outline-offset: -3px;
    }

    .tab-number {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.78rem;
      opacity: 0.7;
    }

    .tab-button[aria-selected="true"] {
      margin-bottom: -1px;
      border-color: var(--border);
      border-bottom: 1px solid var(--surface);
      color: var(--gold);
      background: var(--surface);
    }

    .tab-button[data-tab="problems"][aria-selected="true"] {
      color: var(--teal);
    }

    .tab-button[data-tab="solutions"][aria-selected="true"] {
      color: var(--lavender);
    }

    /* --------------------------------
       Resource heading
    -------------------------------- */

    .resource-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      min-height: 76px;
      padding: 15px 21px;

      border: 1px solid var(--border);
      border-top: none;
      background: var(--surface);
    }

    .resource-heading-main {
      min-width: 0;
    }

    .resource-title {
      margin: 0;
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.17rem;
      font-weight: 500;
    }

    .resource-description {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.79rem;
      line-height: 1.5;
    }

    .resource-index {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
    }

    /* --------------------------------
       Document viewer
    -------------------------------- */

    .document-container {
      overflow: hidden;
      width: 100%;

      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 var(--radius) var(--radius);

      background: var(--background);
    }

    .document-frame {
      display: block;
      width: 100%;
      height: 82vh;
      min-height: 620px;
      max-height: 1200px;

      border: 0;
      background: var(--background);
    }

    .document-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      min-height: 39px;
      padding: 8px 15px;

      border-top: 1px solid var(--border);
      color: var(--muted);
      background: var(--surface);

      font-size: 0.7rem;
    }

    .open-document {
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
      transition: color 160ms ease;
    }

    .open-document:hover {
      color: var(--gold);
    }

    .open-document:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    /* --------------------------------
       Site footer
    -------------------------------- */

    .site-footer {
      display: flex;
      justify-content: space-between;
      gap: 15px;

      padding: 15px clamp(16px, 5vw, 72px);
      border-top: 1px solid var(--border);

      color: var(--muted);
      font-size: 0.7rem;
    }

    .site-footer p {
      margin: 0;
    }

    /* --------------------------------
       Tablet
    -------------------------------- */

    @media (max-width: 800px) {
      .site-header {
        padding: 20px 24px;
      }

      .workspace {
        padding: 20px 20px 28px;
      }

      .tab-button {
        flex: 1;
        padding: 0 12px;
      }

      .document-frame {
        height: 76vh;
        min-height: 540px;
      }
    }

    /* --------------------------------
       Mobile
    -------------------------------- */

    @media (max-width: 520px) {
      .site-header {
        padding: 17px 16px;
      }

      .site-title {
        font-size: 1.8rem;
      }

      .site-subtitle {
        max-width: 285px;
        font-size: 0.8rem;
      }

      .author-label {
        max-width: 90px;
        font-size: 0.59rem;
        line-height: 1.6;
      }

      .workspace {
        padding: 15px 10px 24px;
      }

      .resource-navigation {
        gap: 3px;
        padding-left: 0;
      }

      .tab-button {
        flex-direction: column;
        gap: 3px;

        min-height: 59px;
        padding: 7px 3px;

        font-size: 0.78rem;
      }

      .tab-number {
        font-size: 0.65rem;
      }

      .resource-heading {
        min-height: 69px;
        padding: 12px;
      }

      .resource-title {
        font-size: 1.03rem;
      }

      .resource-description {
        font-size: 0.71rem;
      }

      .resource-index {
        font-size: 0.64rem;
      }

      .document-frame {
        height: 72vh;
        min-height: 440px;
      }

      .document-footer {
        padding: 9px 10px;
        font-size: 0.65rem;
      }

      .site-footer {
        padding: 12px;
        font-size: 0.64rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <div>
      <h1 class="site-title">Integration</h1>
      <p class="site-subtitle">
        History and an Introduction to Integration and Riemann Sums
      </p>
    </div>

    <div class="author-label">
      Edwin Garcia Cuevas
    </div>
  </header>

  <main class="workspace">

    <nav
      class="resource-navigation"
      role="tablist"
      aria-label="Integration learning resources"
    >
      <button
        class="tab-button"
        id="tab-article"
        type="button"
        role="tab"
        aria-selected="true"
        aria-controls="resource-panel"
        tabindex="0"
        data-tab="article"
      >
        <span class="tab-number">01</span>
        <span>Article</span>
      </button>

      <button
        class="tab-button"
        id="tab-problems"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="resource-panel"
        tabindex="-1"
        data-tab="problems"
      >
        <span class="tab-number">02</span>
        <span>Problems</span>
      </button>

      <button
        class="tab-button"
        id="tab-solutions"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="resource-panel"
        tabindex="-1"
        data-tab="solutions"
      >
        <span class="tab-number">03</span>
        <span>Solutions</span>
      </button>
    </nav>

    <section
      id="resource-panel"
      role="tabpanel"
      aria-labelledby="tab-article"
      tabindex="0"
    >
      <header class="resource-heading">
        <div class="resource-heading-main">
          <h2 class="resource-title" id="resource-title">
            Introduction to Integration
          </h2>
          <p class="resource-description" id="resource-description">
            A guided exploration of integration and Riemann sums.
          </p>
        </div>

        <span class="resource-index" id="resource-index">
          01 / 03
        </span>
      </header>

      <div class="document-container">
        <iframe
          class="document-frame"
          id="document-frame"
          src="article.html"
          title="Introduction to Integration article"
          loading="eager"
        ></iframe>

        <div class="document-footer">
          <span id="document-label">Reading material</span>

          <a
            class="open-document"
            id="open-document"
            href="article.html"
            target="_blank"
            rel="noopener"
          >
            Open separately ↗
          </a>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>Continuous White Noise</p>
    <p>Mathematics · Exploration · Understanding</p>
  </footer>

  <script>
    const resources = {
      article: {
        title: "Introduction to Integration",
        description:
          "A guided exploration of integration and Riemann sums.",
        index: "01 / 03",
        label: "Reading material",
        filename: "integration.html",
        frameTitle: "Introduction to Integration article"
      },

      problems: {
        title: "Practice Problems",
        description:
          "Test your understanding.",
        index: "02 / 03",
        label: "Practice material",
        filename: "Practice-problems.pdf",
        frameTitle: "Riemann sums practice problems"
      },

      solutions: {
        title: "Worked Solutions",
        description:
          "Review the reasoning and steps behind each solution.",
        index: "03 / 03",
        label: "Solutions and explanations",
        filename: "solutions.html",
        frameTitle: "Worked solutions to integration problems"
      }
    };

    const tabs = Array.from(
      document.querySelectorAll('[role="tab"]')
    );

    const panel = document.getElementById("resource-panel");
    const title = document.getElementById("resource-title");
    const description = document.getElementById("resource-description");
    const index = document.getElementById("resource-index");
    const frame = document.getElementById("document-frame");
    const documentLabel = document.getElementById("document-label");
    const openDocument = document.getElementById("open-document");

    let activeResource = "article";

    function selectResource(name, moveFocus = false) {
      const resource = resources[name];

      if (!resource) return;

      activeResource = name;

      tabs.forEach((tab) => {
        const selected = tab.dataset.tab === name;

        tab.setAttribute("aria-selected", String(selected));
        tab.tabIndex = selected ? 0 : -1;
      });

      panel.setAttribute("aria-labelledby", `tab-${name}`);

      title.textContent = resource.title;
      description.textContent = resource.description;
      index.textContent = resource.index;
      documentLabel.textContent = resource.label;

      frame.title = resource.frameTitle;
      openDocument.href = resource.filename;

      /*
       * Only load a document when necessary.
       * Returning to a previously opened tab preserves
       * its iframe instead of unnecessarily reloading it.
       */
      if (frame.dataset.resource !== name) {
        frame.src = resource.filename;
        frame.dataset.resource = name;
      }

      if (moveFocus) {
        tabs.find((tab) => tab.dataset.tab === name).focus();
      }
    }

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        selectResource(tab.dataset.tab);
      });

      tab.addEventListener("keydown", (event) => {
        const currentIndex = tabs.indexOf(tab);
        let nextIndex = currentIndex;

        switch (event.key) {
          case "ArrowRight":
            nextIndex = (currentIndex + 1) % tabs.length;
            break;

          case "ArrowLeft":
            nextIndex =
              (currentIndex - 1 + tabs.length) % tabs.length;
            break;

          case "Home":
            nextIndex = 0;
            break;

          case "End":
            nextIndex = tabs.length - 1;
            break;

          default:
            return;
        }

        event.preventDefault();

        selectResource(
          tabs[nextIndex].dataset.tab,
          true
        );
      });
    });

    /*
     * Initialize the article as the main view.
     */
    frame.dataset.resource = "article";
    selectResource("article");
  </script>

</body>
</html>
